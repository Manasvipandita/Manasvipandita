<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Price Prediction</title>
    <link rel="stylesheet" href="design.css">
</head>
<body>
    <header>
        <h1>Phone Price Prediction</h1>
    </header>
    <main>
        <section class="input-section">
            <h2>Enter Phone Specifications</h2>
            <form>
                <label for="battery_power">Battery Power:</label>
		<input type="text" id="battery_power" name="battery_power"><br><br>
		<label for="blue">Blue:</label>
		<input type="text" id="blue" name="blue"><br><br>
		<label for="clock_speed">Clock Speed:</label>
		<input type="text" id="clock_speed" name="clock_speed"><br><br>
		<label for="dual_sim">Dual SIM:</label>
		<input type="text" id="dual_sim" name="dual_sim"><br><br>
		<label for="fc">Front Camera:</label>
		<input type="text" id="fc" name="fc"><br><br>
		<label for="four_g">Four G:</label>
		<input type="text" id="four_g" name="four_g"><br><br>
		<label for="int_memory">Internal Memory:</label>
		<input type="text" id="int_memory" name="int_memory"><br><br>
		<label for="m_dep">Mobile Weight:</label>
		<input type="text" id="m_dep" name="m_dep"><br><br>
		<label for="mobile_wt">Mobile Width:</label>
		<input type="text" id="mobile_wt" name="mobile_wt"><br><br>
		<label for="n_cores">Number of Cores:</label>
		<input type="text" id="n_cores" name="n_cores"><br><br>
		<label for="pc">PC:</label>
		<input type="text" id="pc" name="pc"><br><br>
		<label for="px_height">Pixel Height:</label>
		<input type="text" id="px_height" name="px_height"><br><br>
		<label for="px_width">Pixel Width:</label>
		<input type="text" id="px_width" name="px_width"><br><br>
        <label for="ram">RAM:</label>
		<input type="text" id="ram" name="ram"><br><br>
		<label for="sc_h">Screen Height:</label>
		<input type="text" id="sc_h" name="sc_h"><br><br>
		<label for="sc_w">Screen Width:</label>
		<input type="text" id="sc_w" name="sc_w"><br><br>
		<label for="talk_time">Talk Time:</label>
		<input type="text" id="talk_time" name="talk_time"><br><br>
		<label for="three_g">Three G:</label>
		<input type="text" id="three_g" name="three_g"><br><br>
		<label for="touch_screen">Touch Screen:</label>
		<input type="text" id="touch_screen" name="touch_screen"><br><br>
		<label for="wifi">Wi-Fi:</label>
		<input type="text" id="wifi" name="wifi"><br><br>
		<label for="price_range">Price Range:</label>
		<input type="text" id="price_range" name="price_range"><br><br>
		<input type="submit" value="Submit">
            </form>
        </section>
        <!-- <section class="output-section">
            <h2>Predicted Price:</h2>
            <p id="predicted-price"></p>
        </section> -->
    </main>
    <script src="script.js"></script>
</body>
</html>
